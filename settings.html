<!doctype html><html lang="th"><head><meta name="qa-page" content="settings"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | Complain &amp; Action Tracking</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-api.js?v=37.1.1.3"></script><script src="navigation.js?v=37.1.1"></script><style>*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}.page{max-width:1250px;margin:auto;padding:28px 22px}.card{background:#fff;border-radius:12px;padding:18px;margin:16px 0;border:1px solid #e2e8f0;overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px;vertical-align:middle}input,select,button,textarea{padding:8px;border:1px solid #cbd5e1;border-radius:7px}button{cursor:pointer}.primary{background:#111827;color:#fff}.approve{background:#166534;color:#fff}.reject{background:#fff1f2;color:#9f1239;border-color:#fda4af}.danger{background:#fff7ed;color:#9a3412;border-color:#fdba74}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.note{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:8px;line-height:1.6}.flag{font-weight:700;color:#b45309}.muted{color:#64748b;font-size:13px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}.pending{background:#fff7ed;color:#9a3412}.approved{background:#ecfdf5;color:#166534}.rejected{background:#fff1f2;color:#9f1239}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}</style></head><body class="qa-auth-loading"><main class="page"><h1>Settings</h1><p>System Admin only</p><div class="note">จัดการผู้ใช้ แผนก ประเภทปัญหา และ Priority ได้จากหน้านี้ โดยไม่ต้องเข้า Supabase สำหรับงานประจำ</div><div id="msg"></div><section class="card"><h2>Department Requests</h2><p class="muted">คำขอเพิ่มแผนกจากหน้า Signup ต้องอนุมัติก่อนจึงจะเลือกสมัครสมาชิกได้</p><div id="deptRequests">กำลังโหลด...</div></section><section class="card"><h2>Users / Account Management</h2><div id="users">กำลังโหลด...</div></section><section class="card"><h2>Master Data</h2><div class="grid"><select id="stype"><option>DEPARTMENT</option><option>CATEGORY</option><option>PRIORITY</option></select><input id="scode" placeholder="CODE"><input id="sname" placeholder="Name"><input id="ssort" type="number" value="999"><button class="primary" onclick="saveNewSetting()">+ เพิ่มรายการ</button></div><div id="master" style="margin-top:16px"></div></section><small style="color:#64748b">V37.1.1</small></main><script>let depts=[];document.addEventListener('DOMContentLoaded',()=>setTimeout(init,0));async function wait(){return new Promise((r,j)=>{let n=0,t=setInterval(()=>{if(QA.profile){clearInterval(t);r()}else if(++n>100){clearInterval(t);j()}},50)})}async function init(){await wait();if(QA.profile.role!=='system_admin'){document.querySelector('main').innerHTML='<h1>ไม่มีสิทธิ์</h1><p>สำหรับ System Admin เท่านั้น</p>';return}await reloadAll()}function show(m){document.getElementById('msg').textContent=m||''}async function reloadAll(){try{const [active,all,u,req]=await Promise.all([QA.api.getSettings(),QA.api.getAdminSettings(),QA.api.getAdminUsers(),QA.api.getDepartmentRequests()]);depts=active.departments;renderMaster(all||[]);renderUsers(u||[]);renderRequests(req||[])}catch(e){show(QA.errorOf(e).message)}}function renderRequests(rows){const box=document.getElementById('deptRequests');if(!rows.length){box.textContent='ยังไม่มีคำขอ';return}box.innerHTML='<table><thead><tr><th>สถานะ</th><th>Code</th><th>ชื่อแผนก</th><th>ผู้ขอ</th><th>Email</th><th>วันที่ขอ</th><th>Action</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><span class="pill '+String(r.status).toLowerCase()+'">'+QA.escape(r.status)+'</span></td><td><b>'+QA.escape(r.code)+'</b></td><td>'+QA.escape(r.name)+'</td><td>'+QA.escape(r.requester_name||'-')+'</td><td>'+QA.escape(r.requester_email||'-')+'</td><td>'+fmt(r.requested_at)+'</td><td>'+(r.status==='PENDING'?'<button class="approve" onclick="reviewReq(\''+r.request_id+'\',true)">อนุมัติ</button> <button class="reject" onclick="reviewReq(\''+r.request_id+'\',false)">ปฏิเสธ</button>':'-')+'</td></tr>').join('')+'</tbody></table>'}async function reviewReq(id,approve){const note=prompt((approve?'อนุมัติ':'ปฏิเสธ')+'คำขอแผนก\nหมายเหตุ (ไม่บังคับ)')??null;if(note===null)return;if(!confirm('ยืนยัน'+(approve?'อนุมัติ':'ปฏิเสธ')+'คำขอนี้?'))return;try{await QA.api.reviewDepartmentRequest(id,approve,note);show('บันทึกคำขอแล้ว');await reloadAll()}catch(e){show(QA.errorOf(e).message)}}function renderUsers(rows){const box=document.getElementById('users');const t=document.createElement('table');t.innerHTML='<thead><tr><th>Email</th><th>ชื่อ</th><th>Role</th><th>Department</th><th>Active</th><th>Password</th><th>Action</th></tr></thead>';const b=document.createElement('tbody');rows.forEach(u=>{const tr=document.createElement('tr');tr.dataset.id=u.user_id;tr.dataset.email=u.email||'';const opts=['user','department_admin','system_admin','viewer'].map(x=>'<option '+(x===u.role?'selected':'')+'>'+x+'</option>').join('');const ds=['<option value="">-</option>',...depts.map(d=>'<option value="'+QA.escape(d.code)+'" '+(d.code===u.department?'selected':'')+'>'+QA.escape(d.code)+'</option>')].join('');const pw=u.must_change_password?'<span class="flag">ต้องเปลี่ยนรหัสเมื่อ Login</span>':'ปกติ';tr.innerHTML='<td>'+QA.escape(u.email||'')+'</td><td><input class="n" value="'+QA.escape(u.display_name||'')+'"></td><td><select class="r">'+opts+'</select></td><td><select class="d">'+ds+'</select></td><td><input class="on" type="checkbox" '+(u.active?'checked':'')+'></td><td>'+pw+'</td><td><button onclick="saveUser(this)">บันทึก</button> <button class="danger" onclick="resetPw(this)">ตั้งรหัสชั่วคราว</button></td>';b.append(tr)});t.append(b);box.replaceChildren(t)}async function saveUser(btn){const tr=btn.closest('tr');try{const role=tr.querySelector('.r').value,active=tr.querySelector('.on').checked;if(tr.dataset.id===QA.profile.user_id&&(role!=='system_admin'||!active)){throw new Error('CANNOT_DISABLE_OWN_ADMIN')}await QA.api.updateAdminUser({userId:tr.dataset.id,displayName:tr.querySelector('.n').value,role,department:tr.querySelector('.d').value,approvalStatus:'APPROVED',active});show('บันทึก User แล้ว');await reloadAll()}catch(e){show(QA.errorOf(e).message)}}async function resetPw(btn){const tr=btn.closest('tr');const email=tr.dataset.email||'';const p1=prompt('ตั้งรหัสผ่านชั่วคราวสำหรับ '+email+'\nอย่างน้อย 8 ตัวอักษร');if(p1===null)return;if(p1.length<8){show('รหัสผ่านชั่วคราวต้องมีอย่างน้อย 8 ตัวอักษร');return}const p2=prompt('กรอกรหัสผ่านชั่วคราวซ้ำอีกครั้ง');if(p2===null)return;if(p1!==p2){show('รหัสผ่านทั้งสองครั้งไม่ตรงกัน');return}if(!confirm('ยืนยันรีเซ็ตรหัสผ่านของ '+email+' ?'))return;btn.disabled=true;try{await QA.api.adminSetTemporaryPassword(tr.dataset.id,p1);show('ตั้งรหัสผ่านชั่วคราวแล้ว');await reloadAll()}catch(e){show(QA.errorOf(e).message)}finally{btn.disabled=false}}function renderMaster(rows){document.getElementById('master').innerHTML='<table><thead><tr><th>Type</th><th>Code</th><th>Name</th><th>Sort</th><th>Active</th><th>Action</th></tr></thead><tbody>'+rows.map(x=>'<tr data-type="'+QA.escape(x.setting_type)+'" data-code="'+QA.escape(x.code)+'"><td>'+QA.escape(x.setting_type)+'</td><td><b>'+QA.escape(x.code)+'</b></td><td><input class="mn" value="'+QA.escape(x.name)+'"></td><td><input class="ms" type="number" value="'+Number(x.sort_order||999)+'" style="width:90px"></td><td><input class="ma" type="checkbox" '+(x.active?'checked':'')+'></td><td><button onclick="saveMasterRow(this)">บันทึก</button></td></tr>').join('')+'</tbody></table>'}async function saveMasterRow(btn){const tr=btn.closest('tr');try{await QA.api.upsertSetting({type:tr.dataset.type,code:tr.dataset.code,name:tr.querySelector('.mn').value,sortOrder:tr.querySelector('.ms').value,active:tr.querySelector('.ma').checked});show('บันทึก Master Data แล้ว');await reloadAll()}catch(e){show(QA.errorOf(e).message)}}async function saveNewSetting(){try{await QA.api.upsertSetting({type:document.getElementById('stype').value,code:document.getElementById('scode').value,name:document.getElementById('sname').value,sortOrder:document.getElementById('ssort').value,active:true});document.getElementById('scode').value='';document.getElementById('sname').value='';show('เพิ่ม Master Data แล้ว');await reloadAll()}catch(e){show(QA.errorOf(e).message)}}function fmt(v){if(!v)return'-';try{return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Bangkok'}).format(new Date(v))}catch{return String(v)}}</script></body></html>

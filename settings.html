<!doctype html><html lang="th"><head><meta name="qa-page" content="settings"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-api.js?v=35.0"></script><script src="navigation.js?v=35.0"></script><style>*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}.page{max-width:1250px;margin:auto;padding:28px 22px}.card{background:#fff;border-radius:12px;padding:18px;margin:16px 0;border:1px solid #e2e8f0;overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}input,select,button{padding:8px;border:1px solid #cbd5e1;border-radius:7px}button{cursor:pointer}.primary{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}</style></head><body class="qa-auth-loading"><main class="page"><h1>Settings</h1><p>System Admin only</p><div id="msg"></div><section class="card"><h2>Users / Approval</h2><div id="users">กำลังโหลด...</div></section><section class="card"><h2>Master Data</h2><div class="grid"><select id="stype"><option>DEPARTMENT</option><option>CATEGORY</option><option>PRIORITY</option></select><input id="scode" placeholder="CODE"><input id="sname" placeholder="Name"><input id="ssort" type="number" value="999"><button class="primary" onclick="saveSetting()">เพิ่ม / บันทึก</button></div><div id="master" style="margin-top:16px"></div></section></main><script>let depts=[];document.addEventListener('DOMContentLoaded',()=>setTimeout(init,0));async function wait(){return new Promise((r,j)=>{let n=0,t=setInterval(()=>{if(QA.profile){clearInterval(t);r()}else if(++n>100){clearInterval(t);j()}},50)})}async function init(){await wait();if(QA.profile.role!=='system_admin'){document.querySelector('main').innerHTML='<h1>ไม่มีสิทธิ์</h1><p>สำหรับ System Admin เท่านั้น</p>';return}await reloadAll()}async function reloadAll(){try{const s=await QA.api.getSettings();depts=s.departments;renderMaster(s);const u=await QA.api.getAdminUsers();renderUsers(u||[])}catch(e){show(e.message)}}function show(m){document.getElementById('msg').textContent=m||''}function renderUsers(rows){const box=document.getElementById('users');const t=document.createElement('table');t.innerHTML='<thead><tr><th>Email</th><th>ชื่อ</th><th>Role</th><th>Department</th><th>Approval</th><th>Active</th><th>Action</th></tr></thead>';const b=document.createElement('tbody');rows.forEach((u,i)=>{const tr=document.createElement('tr');tr.dataset.id=u.user_id;tr.dataset.email=u.email||'';const opts=['user','department_admin','system_admin','viewer'].map(x=>'<option '+(x===u.role?'selected':'')+'>'+x+'</option>').join('');const ds=['<option value="">-</option>',...depts.map(d=>'<option value="'+QA.escape(d.code)+'" '+(d.code===u.department?'selected':'')+'>'+QA.escape(d.code)+'</option>')].join('');const aps=['PENDING','APPROVED','REJECTED'].map(x=>'<option '+(x===u.approval_status?'selected':'')+'>'+x+'</option>').join('');tr.innerHTML='<td>'+QA.escape(u.email||'')+'</td><td><input class="n" value="'+QA.escape(u.display_name||'')+'"></td><td><select class="r">'+opts+'</select></td><td><select class="d">'+ds+'</select></td><td><select class="a">'+aps+'</select></td><td><input class="on" type="checkbox" '+(u.active?'checked':'')+'></td><td><button onclick="saveUser(this)">บันทึก</button> <button onclick="resetPw(this)">Reset password</button></td>';b.append(tr)});t.append(b);box.replaceChildren(t)}async function saveUser(btn){const tr=btn.closest('tr');try{await QA.api.updateAdminUser({userId:tr.dataset.id,displayName:tr.querySelector('.n').value,role:tr.querySelector('.r').value,department:tr.querySelector('.d').value,approvalStatus:tr.querySelector('.a').value,active:tr.querySelector('.on').checked});show('บันทึก User แล้ว');await reloadAll()}catch(e){show(QA.errorOf(e).message)}}async function resetPw(btn){try{await QA.api.sendPasswordReset(btn.closest('tr').dataset.email);show('ส่งอีเมลรีเซ็ตรหัสผ่านแล้ว')}catch(e){show(e.message)}}function renderMaster(s){const rows=[...s.departments.map(x=>['DEPARTMENT',x]),...s.categories.map(x=>['CATEGORY',x]),...s.priorities.map(x=>['PRIORITY',x])];document.getElementById('master').innerHTML='<table><thead><tr><th>Type</th><th>Code</th><th>Name</th><th>Sort</th></tr></thead><tbody>'+rows.map(([t,x])=>'<tr><td>'+t+'</td><td>'+QA.escape(x.code)+'</td><td>'+QA.escape(x.name)+'</td><td>'+x.sortOrder+'</td></tr>').join('')+'</tbody></table>'}async function saveSetting(){try{await QA.api.upsertSetting({type:document.getElementById('stype').value,code:document.getElementById('scode').value,name:document.getElementById('sname').value,sortOrder:document.getElementById('ssort').value,active:true});show('บันทึก Setting แล้ว');await reloadAll()}catch(e){show(QA.errorOf(e).message)}}</script></body></html>

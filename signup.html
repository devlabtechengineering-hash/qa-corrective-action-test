<!doctype html><html lang="th"><head><meta name="qa-page" content="signup"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | Work Request</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-api.js?v=35.3"></script><style>*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;margin:0;padding:30px 16px}main{max-width:520px;margin:auto;background:#fff;border-radius:14px;padding:30px;box-shadow:0 8px 30px #0001}h1{margin-top:0}label{display:block;font-weight:700;margin:15px 0 6px}input,select,button,a{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}button{background:#111827;color:#fff;margin-top:20px}.back{display:block;text-align:center;margin-top:10px;text-decoration:none;color:#334155}.msg{margin-top:14px;color:#b91c1c;white-space:pre-wrap}.success{background:#ecfdf5;border:1px solid #a7f3d0;padding:18px;border-radius:9px;line-height:1.7}</style></head><body><main><h1>สมัครสมาชิกใหม่</h1><p>เลือกแผนกจริงของคุณ ข้อมูลนี้จะใช้ระบุแผนกต้นทางของใบงานและสถิติ</p><form id="signupForm"><label>ชื่อ-นามสกุล</label><input id="displayName" required maxlength="120"><label>แผนก</label><select id="department" required><option value="">-- เลือกแผนก --</option></select><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" required minlength="6" autocomplete="new-password"><label>ยืนยัน Password</label><input id="confirmPassword" type="password" required minlength="6" autocomplete="new-password"><button id="signupBtn" type="submit">สมัครสมาชิก</button><div id="signupError" class="msg"></div></form><div id="signupSuccess" class="success" hidden><b>สมัครสมาชิกสำเร็จ</b><br>เมื่อตั้ง Supabase เป็นไม่ต้องยืนยันอีเมล ระบบจะเข้าสู่ระบบให้ทันทีหลังสมัครสำเร็จ หากภายหลังเปิด Email Confirmation ระบบจะแจ้ง

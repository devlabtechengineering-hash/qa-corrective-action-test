<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA Corrective Action - Sign in</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-api.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#222;margin:0;padding:48px 18px}
main{background:white;border-radius:12px;max-width:460px;margin:5vh auto;padding:32px;box-shadow:0 2px 14px #0001}
h1{font-size:24px;margin-top:0}p{color:#555;line-height:1.6}label{display:block;margin:18px 0 6px;font-weight:600}
input,button{width:100%;padding:12px;font-size:16px;border-radius:7px;border:1px solid #ccc}button{margin-top:24px;background:#111827;color:white;cursor:pointer}
button:disabled{opacity:.5}#loginError{color:#b91c1c;white-space:pre-wrap;line-height:1.5;margin-top:18px}
small{display:block;margin-top:24px;color:#666;line-height:1.6}
</style></head><body><main>
<h1>QA Corrective Action</h1><p>เข้าสู่ระบบด้วยบัญชีทดสอบ Supabase Auth</p>
<form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" type="submit">เข้าสู่ระบบ / Sign in</button><div id="loginError" role="alert"></div></form>
<small>ผู้ดูแลต้องสร้างบัญชีและกำหนดสิทธิ์ใน qa_profiles ก่อนใช้งาน<br>No public sign-up. No administrator keys in this page.</small>
</main></body></html>

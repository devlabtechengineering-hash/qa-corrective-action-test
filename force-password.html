<!doctype html><html lang="th"><head><meta name="qa-page" content="forcePassword"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งรหัสผ่านใหม่</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-api.js?v=37.1.4"></script><style>*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;margin:0;padding:35px 18px;color:#1f2937}main{background:#fff;border-radius:14px;max-width:500px;margin:5vh auto;padding:30px;box-shadow:0 8px 30px #00000012}.logo{height:68px;display:flex;justify-content:center;margin-bottom:18px}.logo img{max-width:100%;height:100%;object-fit:contain}h1{margin:0 0 8px}p{line-height:1.65;color:#475569}.notice{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:13px;border-radius:8px;margin:16px 0}label{display:block;margin:15px 0 6px;font-weight:700}input,button{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #cbd5e1}button{margin-top:20px;background:#111827;color:#fff;cursor:pointer}.msg{color:#b91c1c;margin-top:14px;white-space:pre-wrap}</style></head><body class="qa-auth-loading"><main><div class="logo"><img src="labtech-logo.png" alt="LABTECH"></div><h1>ตั้งรหัสผ่านใหม่</h1><div class="notice">System Admin ได้รีเซ็ตรหัสผ่านของบัญชีนี้ กรุณาตั้งรหัสผ่านใหม่ของคุณก่อนเข้าใช้งานระบบ</div><form id="changeForm"><label>รหัสผ่านใหม่</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required><label>ยืนยันรหัสผ่านใหม่</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button id="saveBtn" type="submit">บันทึกรหัสผ่านใหม่</button><div id="msg" class="msg" role="alert"></div></form><small style="display:block;margin-top:18px;color:#64748b">V37.1.4</small></main><script>document.addEventListener('DOMContentLoaded',()=>setTimeout(initForce,0));async function initForce(){let n=0;while(!QA.profile&&n++<100)await new Promise(r=>setTimeout(r,50));if(!QA.profile)return;if(!QA.profile.must_change_password){location.replace(QA.pageUrl('work'));return}document.getElementById('changeForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('saveBtn'),msg=document.getElementById('msg');btn.disabled=true;msg.textContent='';try{const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p!==c)throw new Error('รหัสผ่านทั้งสองช่องไม่ตรงกัน');await QA.api.changeForcedPassword(p);location.replace(QA.pageUrl('work'))}catch(err){msg.textContent=QA.errorOf(err).message}finally{btn.disabled=false}})}</script></body></html>

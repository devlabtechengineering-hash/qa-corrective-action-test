<!doctype html>
<html lang="th">
<head>
  <meta name="qa-page" content="work">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ใบงาน</title>
  <!-- V37.1.2: System Admin global worklist -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-api.js?v=37.1.2"></script>
  <script src="navigation.js?v=37.1.2"></script>
  <style>
    *{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}
    .page{max-width:1180px;margin:auto;padding:30px 24px}h1{margin:0}.sub{color:#64748b;margin:7px 0 18px}
    .search-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
    .search-row{display:flex;gap:10px;align-items:center}.search-row input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:10px;padding:11px 13px;font-size:14px}.search-row button{border:0;border-radius:10px;background:#111827;color:#fff;padding:11px 16px;font-weight:800;cursor:pointer}.search-help{font-size:12px;color:#64748b;margin-top:8px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.tabs button.active{background:#111827;color:#fff;border-color:#111827}
    .summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.pill{border:1px solid #e2e8f0;padding:7px 11px;border-radius:999px;background:#fff;font-size:12px;font-weight:800;cursor:pointer}.pill.active{outline:2px solid #111827;outline-offset:1px}
    .list{display:grid;gap:12px}.job{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}.route{font-weight:800}.meta{font-size:13px;color:#64748b;margin-top:7px;line-height:1.55}
    .status{display:inline-flex!important;align-items:center;justify-content:center;align-self:start;justify-self:end;width:fit-content!important;height:auto!important;min-height:0!important;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;white-space:nowrap;line-height:1.2}
    .status.OPEN{background:#fff3cd;color:#856404}.status.IN_PROGRESS{background:#dbeafe;color:#1e40af}.status.WAITING_REVIEW{background:#ede9fe;color:#5b21b6}.status.REWORK{background:#fee2e2;color:#991b1b}.status.CLOSED{background:#dcfce7;color:#166534}.status.CANCELLED{background:#e5e7eb;color:#374151}.status.UNKNOWN{background:#e5e7eb;color:#374151}
    .open{display:inline-block;margin-top:10px;background:#111827;color:#fff;text-decoration:none;padding:8px 12px;border-radius:7px}.empty{background:#fff;padding:28px;border-radius:12px;color:#64748b;text-align:center}.count{font-size:13px;color:#64748b;margin:0 0 12px}
    @media(max-width:650px){.page{padding:22px 14px}.job{grid-template-columns:1fr}.status{justify-self:start}.search-row{flex-direction:column;align-items:stretch}}
  </style>
</head>
<body class="qa-auth-loading">
<main class="page">
  <h1>ใบงาน</h1>
  <div id="profileText" class="sub"></div>
  <section class="search-card">
    <div class="search-row">
      <input id="globalSearch" type="search" autocomplete="off" placeholder="ค้นหา Job ID, Serial, ชื่อผู้แจ้ง, แผนก, สถานะ, วันที่ หรือคำในรายละเอียด...">
      <button type="button" id="searchBtn">ค้นหา</button>
    </div>
    <div class="search-help">ค้นหาได้จากคำเดียว เช่น IPN-2026-0001, MAINT, WAITING REVIEW, 28/09/2026 หรือข้อความในใบงาน</div>
  </section>
  <div id="tabs" class="tabs"></div>
  <div id="summary" class="summary"></div>
  <p id="resultCount" class="count"></p>
  <div id="list" class="list"><div class="empty">กำลังโหลด...</div></div>
</main>
<script>
let scope='', statusFilter='', lastJobs=[];
const baseScopes=[['mine','งานที่ฉันแจ้ง'],['received','งานเข้าแผนก'],['department_sent','งานที่แผนกแจ้ง'],['review','รอตรวจรับ'],['closed','ปิด / ยกเลิกแล้ว']];
document.addEventListener('DOMContentLoaded',()=>{setTimeout(initWork,0)});
async function initWork(){await waitQA();const role=QA.profile.role;const dept=String(QA.profile.department||'').trim();document.getElementById('profileText').textContent=role==='system_admin'?(QA.profile.display_name||'')+' · System Admin · ทุกแผนก':(QA.profile.display_name||'')+' · '+(dept||'-');scope=(role==='system_admin'||role==='viewer')?'all':'mine';renderTabs();document.getElementById('searchBtn').onclick=()=>loadScope();document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')loadScope()});loadScope()}
function waitQA(){return new Promise((res,rej)=>{let n=0;const t=setInterval(()=>{if(QA.profile){clearInterval(t);res()}else if(++n>100){clearInterval(t);rej(new Error('Profile load timeout'))}},50)})}
function availableScopes(){const role=QA.profile.role,dept=String(QA.profile.department||'').trim();if(role==='system_admin')return [['all','ทั้งหมด'],baseScopes[0]];if(role==='viewer')return [['all','ทั้งหมด']];const out=[baseScopes[0]];if(role==='department_admin'&&dept)out.push(...baseScopes.slice(1));else out.push(baseScopes[4]);return out}
function renderTabs(){const box=document.getElementById('tabs'),items=availableScopes();if(!items.some(x=>x[0]===scope))scope=items[0][0];box.replaceChildren();for(const [s,l] of items){const b=document.createElement('button');b.textContent=l;b.className=s===scope?'active':'';b.onclick=()=>{scope=s;statusFilter='';renderTabs();loadScope()};box.append(b)}}
async function loadScope(){const list=document.getElementById('list');list.innerHTML='<div class="empty">กำลังโหลด...</div>';document.getElementById('resultCount').textContent='';try{const q=document.getElementById('globalSearch').value.trim();const r=await QA.api.getWorklist(scope,q);lastJobs=r.jobs||[];statusFilter='';render(lastJobs)}catch(e){lastJobs=[];document.getElementById('summary').replaceChildren();list.innerHTML='<div class="empty">'+QA.escape(QA.errorOf(e).message)+'</div>'}}
function render(jobs){const list=document.getElementById('list'),sum=document.getElementById('summary');list.replaceChildren();sum.replaceChildren();const counts={OPEN:0,IN_PROGRESS:0,WAITING_REVIEW:0,REWORK:0,CLOSED:0,CANCELLED:0};jobs.forEach(j=>{counts[j.status]=(counts[j.status]||0)+1});for(const [s,n] of Object.entries(counts)){if(!n)continue;const x=document.createElement('button');x.type='button';x.className='pill'+(statusFilter===s?' active':'');x.textContent=QA.statusInfo(s).label+' : '+n;x.onclick=()=>{statusFilter=statusFilter===s?'':s;render(lastJobs)};sum.append(x)}const shown=statusFilter?jobs.filter(j=>j.status===statusFilter):jobs;document.getElementById('resultCount').textContent='พบ '+shown.length+' ใบงาน'+(statusFilter?' · กรอง '+QA.statusInfo(statusFilter).label:'');if(!shown.length){list.innerHTML='<div class="empty">ไม่พบใบงานตามเงื่อนไข</div>';return}shown.forEach(j=>{const c=document.createElement('article');c.className='job';const left=document.createElement('div');left.innerHTML='<div class="route">'+QA.escape(j.fromDepartment)+' → '+QA.escape(j.toDepartment)+'</div><div><b>'+QA.escape(j.jobId)+'</b></div><div class="meta">ผู้แจ้ง: '+QA.escape(j.issuerName)+' · '+QA.escape(j.createdDateTime)+'<br>'+QA.escape(j.category)+' · '+QA.escape(j.priority)+'</div><a class="open" href="'+QA.escape(QA.jobUrl(j.jobId))+'">เปิดใบงาน</a>';const right=document.createElement('div');QA.setStatusBadge(right,j.status);c.append(left,right);list.append(c)})}
</script>
</body></html>

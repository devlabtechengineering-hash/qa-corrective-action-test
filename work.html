<!doctype html><html lang="th"><head><meta name="qa-page" content="work"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>งานของฉัน</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-api.js?v=35.0"></script><script src="navigation.js?v=35.0"></script><style>*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}.page{max-width:1180px;margin:auto;padding:30px 24px}h1{margin:0}.sub{color:#64748b;margin:7px 0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.tabs button.active{background:#111827;color:#fff;border-color:#111827}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.pill{background:#fff;border:1px solid #e2e8f0;padding:8px 12px;border-radius:8px}.list{display:grid;gap:12px}.job{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px}.route{font-weight:800}.meta{font-size:13px;color:#64748b;margin-top:7px}.status{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.status.OPEN{background:#fff3cd;color:#856404}.status.IN_PROGRESS{background:#dbeafe;color:#1e40af}.status.WAITING_REVIEW{background:#ede9fe;color:#5b21b6}.status.REWORK{background:#fee2e2;color:#991b1b}.status.CLOSED{background:#dcfce7;color:#166534}.status.CANCELLED{background:#e5e7eb;color:#374151}.open{display:inline-block;margin-top:10px;background:#111827;color:#fff;text-decoration:none;padding:8px 12px;border-radius:7px}.empty{background:#fff;padding:28px;border-radius:12px;color:#64748b;text-align:center}@media(max-width:650px){.job{grid-template-columns:1fr}}</style></head><body class="qa-auth-loading"><main class="page"><h1>งานของฉัน</h1><div id="profileText" class="sub"></div><div id="tabs" class="tabs"></div><div id="summary" class="summary"></div><div id="list" class="list"><div class="empty">กำลังโหลด...</div></div></main><script>let scope='mine';const scopes=[['mine','งานที่ฉันแจ้ง'],['received','งานที่แผนกได้รับ'],['department_sent','งานที่แผนกแจ้ง'],['review','รอตรวจรับ'],['closed','ปิด/ยกเลิกแล้ว']];document.addEventListener('DOMContentLoaded',()=>{setTimeout(initWork,0)});async function initWork(){await waitQA();document.getElementById('profileText').textContent=(QA.profile.display_name||'')+' · '+(QA.profile.department||'-');renderTabs();loadScope()}function waitQA(){return new Promise((res,rej)=>{let n=0;const t=setInterval(()=>{if(QA.profile){clearInterval(t);res()}else if(++n>100){clearInterval(t);rej(new Error('Profile load timeout'))}},50)})}function renderTabs(){const role=QA.profile.role;const canDept=['department_admin','system_admin'].includes(role);const box=document.getElementById('tabs');box.replaceChildren();for(const [s,l] of scopes){if(!canDept&&['received','department_sent','review'].includes(s))continue;const b=document.createElement('button');b.textContent=l;b.className=s===scope?'active':'';b.onclick=()=>{scope=s;renderTabs();loadScope()};box.append(b)}}async function loadScope(){const list=document.getElementById('list');list.innerHTML='<div class="empty">กำลังโหลด...</div>';try{const r=await QA.api.getWorklist(scope);render(r.jobs||[])}catch(e){list.innerHTML='<div class="empty">'+QA.escape(QA.errorOf(e).message)+'</div>'}}function render(jobs){const list=document.getElementById('list');const sum=document.getElementById('summary');list.replaceChildren();sum.replaceChildren();const counts={};jobs.forEach(j=>counts[j.status]=(counts[j.status]||0)+1);Object.entries(counts).forEach(([s,n])=>{const x=document.createElement('div');x.className='pill';x.textContent=QA.statusInfo(s).label+' : '+n;sum.append(x)});if(!jobs.length){list.innerHTML='<div class="empty">ไม่มีใบงานในกลุ่มนี้</div>';return}jobs.forEach(j=>{const c=document.createElement('article');c.className='job';const left=document.createElement('div');left.innerHTML='<div class="route">'+QA.escape(j.fromDepartment)+' → '+QA.escape(j.toDepartment)+'</div><div><b>'+QA.escape(j.jobId)+'</b></div><div class="meta">ผู้แจ้ง: '+QA.escape(j.issuerName)+' · '+QA.escape(j.createdDateTime)+'<br>'+QA.escape(j.category)+' · '+QA.escape(j.priority)+'</div><a class="open" href="'+QA.escape(QA.jobUrl(j.jobId))+'">เปิดใบงาน</a>';const right=document.createElement('div');QA.setStatusBadge(right,j.status);c.append(left,right);list.append(c)})}</script></body></html>

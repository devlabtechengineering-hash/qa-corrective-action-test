<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;padding:35px 16px}main{max-width:480px;margin:auto;background:#fff;padding:28px;border-radius:14px}label{display:block;font-weight:700;margin:14px 0 6px}input,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}button{background:#111827;color:white;margin-top:18px}.msg{white-space:pre-wrap;margin-top:14px}</style></head><body><main><h1>Reset password</h1><div id="requestBox"><p>กรอก Email เพื่อรับลิงก์ตั้งรหัสผ่านใหม่</p><label>Email</label><input id="email" type="email"><button id="sendBtn">ส่งลิงก์รีเซ็ต</button></div><div id="changeBox" hidden><p>ตั้งรหัสผ่านใหม่</p><label>Password ใหม่</label><input id="newPassword" type="password" minlength="6"><button id="changeBtn">บันทึกรหัสผ่านใหม่</button></div><div id="msg" class="msg"></div><p><a href="login.html">กลับหน้า Login</a></p></main><script>(async()=>{const c=supabase.createClient(QA_CONFIG.supabaseUrl,QA_CONFIG.publishableKey,{auth:{persistSession:true,detectSessionInUrl:true}});const msg=document.getElementById('msg');const showChange=()=>{document.getElementById('requestBox').hidden=true;document.getElementById('changeBox').hidden=false};const {data}=await c.auth.getSession();if(data.session)showChange();c.auth.onAuthStateChange((e,s)=>{if(e==='PASSWORD_RECOVERY'||s)showChange()});document.getElementById('sendBtn').onclick=async()=>{msg.textContent='';const email=document.getElementById('email').value.trim();const redirectTo=new URL('reset-password.html',location.href).href;const {error}=await c.auth.resetPasswordForEmail(email,{redirectTo});msg.textContent=error?error.message:'ส่งลิงก์แล้ว กรุณาตรวจอีเมล'};document.getElementById('changeBtn').onclick=async()=>{const password=document.getElementById('newPassword').value;const {error}=await c.auth.updateUser({password});if(error){msg.textContent=error.message;return}msg.textContent='เปลี่ยนรหัสผ่านสำเร็จ กำลังกลับหน้า Login';await c.auth.signOut();setTimeout(()=>location.replace('login.html'),900)}})();</script></body></html>
